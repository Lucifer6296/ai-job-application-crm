services:
  # ── 1. Spring Boot Backend Service ─────────────────────────────────────
  - type: web
    name: jobtracker-backend-egb5
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "5432"
      - key: POSTGRES_DB
        sync: false
      - key: POSTGRES_USER
        sync: false
      - key: POSTGRES_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: MAIL_USERNAME
        value: tamalsaha181@gmail.com
      - key: MAIL_PASSWORD
        value: cjpx fgrt pfrz hjjo

  # ── 2. React Frontend Service (Nginx) ─────────────────────────────────
  - type: web
    name: jobtracker-frontend-egb5
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    plan: free
    envVars:
      - key: BACKEND_URL
        value: https://jobtracker-backend-egb5.onrender.com
